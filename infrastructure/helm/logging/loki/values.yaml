
# Deployment mode
# Monolithic runs all Loki components in one process.
deploymentMode: Monolithic

# Loki configuration
loki:
  # Authentication is disabled for this private local lab.
  auth_enabled: false

  # A single replica requires replication factor 1.
  commonConfig:
    replication_factor: 1

  # Storage schema for a new Loki installation.
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # Filesystem storage for local Kind environment.
  storage:
    type: filesystem

  storage_config:
    filesystem:
      directory: /var/loki/chunks

  # Log retention and ingestion limits.
  limits_config:
    allow_structured_metadata: true
    retention_period: 168h

  # Compactor manages retention and deletion.
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

# Single Loki instance.
singleBinary:
  replicas: 1

  persistence:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Enable gateway for internal cluster access.
gateway:
  enabled: true

# Loki Canary continuously tests log ingestion.
lokiCanary:
  enabled: true

# No MinIO required for filesystem storage.
# minio:
#   enabled: false

# Disable components not used in Monolithic mode.
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0
