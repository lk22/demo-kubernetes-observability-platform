apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo
  namespace: argocd
spec:
  project: platform-gitops

  source:
    repoURL: https://github.com/lk22/demo-kubernetes-observability-platform.git
    targetRevision: main
    path: infrastructure/argocd/bootstrap/gitops-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo

  syncPolicy:
    automated:
      prune: false
      enabled: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false